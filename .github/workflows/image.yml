name: image

# Build and publish the Bridge images to GHCR (a public package from v0.3.0,
# pulled with no login; the source repo stays private) on a v* tag and on manual
# dispatch. Four targets of one
# Dockerfile:
#   - slim -> ghcr.io/kodestar/audiosilo-bridge:<tag>-slim, :latest-slim (amd64, arm64)
#   - full -> ghcr.io/kodestar/audiosilo-bridge:<tag>, :latest           (amd64, arm64)
#   - cuda -> ghcr.io/kodestar/audiosilo-bridge:<tag>-cuda, :latest-cuda (amd64 only)
#   - agent -> ghcr.io/kodestar/audiosilo-bridge:<tag>-agent, :latest-agent (amd64, arm64;
#             the agent container, decision 15)
# latest* moves only for a release tag (not a pre-release like v1.2.0-rc.1); a
# dispatch from a branch publishes under the branch's name (<branch>, -slim, -cuda, -agent).
# The Go binary and the page cross-build on the runner ($BUILDPLATFORM); only the
# final apt step of the arm64 legs runs under QEMU (the agent leg also runs the
# CLIs' --version there).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: full
            suffix: ""
            platforms: linux/amd64,linux/arm64
          - target: slim
            suffix: "-slim"
            platforms: linux/amd64,linux/arm64
          - target: cuda
            suffix: "-cuda"
            platforms: linux/amd64
          - target: agent
            suffix: "-agent"
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest=false: the "latest" metadata-action adds by itself for a tag push
      # never carries the suffix, so every leg would push the bare :latest (and
      # the last to finish, cuda's amd64-only image say, would own it). The raw
      # latest below does carry it (latest, latest-slim, latest-cuda), and only
      # for a release tag: a dispatch from a branch publishes under the branch's
      # name, never over latest.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kodestar/audiosilo-bridge
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          platforms: ${{ matrix.platforms }}
          # The tag itself (outputs.version carries the leg's suffix: v1.2.3-slim).
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
