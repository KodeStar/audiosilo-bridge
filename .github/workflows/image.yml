name: image

# Build and publish the Bridge images to GHCR (a private package while the repo
# is private) on a v* tag and on manual dispatch. Three targets of one
# Dockerfile:
#   - slim -> ghcr.io/kodestar/audiosilo-bridge:<tag>-slim, :latest-slim (amd64, arm64)
#   - full -> ghcr.io/kodestar/audiosilo-bridge:<tag>, :latest           (amd64, arm64)
#   - cuda -> ghcr.io/kodestar/audiosilo-bridge:<tag>-cuda, :latest-cuda (amd64 only)
# The Go binary and the page cross-build on the runner ($BUILDPLATFORM); only the
# final apt step of the arm64 legs runs under QEMU.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: full
            suffix: ""
            platforms: linux/amd64,linux/arm64
          - target: slim
            suffix: "-slim"
            platforms: linux/amd64,linux/arm64
          - target: cuda
            suffix: "-cuda"
            platforms: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kodestar/audiosilo-bridge
          flavor: |
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && steps.meta.outputs.version || format('dev-{0}', github.sha) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
