name: release

# Attach the ASR worker builds to the tag's GitHub release on a v* tag, for a
# worker installed by hand (the Bridge's own install.sh serves the same builds
# from the image, see internal/workerdist). Four archives, one per platform a
# worker runs on, each holding the audiosilo-bridge binary built with the tag as
# its version (CGO off, as the images build it), plus checksums.txt.
#
# The release is created (published, not a draft) when the tag has none yet; a
# re-run replaces the assets (--clobber). image.yml builds the images for the
# same tags.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  workers:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          check-latest: true

      - name: Build the worker archives
        run: |
          set -eu
          ver="${TAG#v}"
          mkdir -p dist
          for p in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${p%/*}"; arch="${p#*/}"
            name="audiosilo-bridge_${ver}_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "build/$name/audiosilo-bridge" ./cmd/audiosilo-bridge
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' > checksums.txt)
          cat dist/checksums.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            case "$TAG" in
              *-*) gh release create "$TAG" --verify-tag --title "$TAG" --notes "" --prerelease ;;
              *) gh release create "$TAG" --verify-tag --title "$TAG" --notes "" ;;
            esac
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
