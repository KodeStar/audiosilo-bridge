# An AudioSilo server with its Bridge: three services, and a fourth for an
# OpenAI-compatible endpoint.
#
#   audiosilo  the server: the libraries (read-only), the player and the
#              console, where Bridge jobs are started and watched.
#   bridge     the Bridge: pairs with the server, takes its jobs (generated
#              characters and recaps for a book), transcribes the audio itself
#              and writes the results into the book's .audiosilo/ folder.
#   agent      the agent container: runs the AI CLIs the Bridge's jobs need,
#              walled off from everything else (see below).
#   agent-endpoint
#              only for an OpenAI-compatible endpoint (profile "endpoint"):
#              the same image, walled off from the agent container too.
#
# The server reads the libraries read-only; the Bridge mounts the SAME host
# folders read-write. Mounting them at the same path in both containers means
# the Bridge needs no mapping (it looks for each library at the server's own
# root path). Mounted elsewhere, map it on the Bridge's page or with
# AUDIOSILO_BRIDGE_LIBRARIES ("<library id>=<path>;...").
#
# Pair once: in the server's console, Settings > Bridge > Connect a bridge,
# then paste the code on the Bridge's page (http://<host>:8091), or set
# AUDIOSILO_BRIDGE_PAIR_CODE below for the first start and remove it after.
#
# PUID/PGID: use the owner of your library folders (Unraid: 99/100), the same
# for both, so files the Bridge writes belong to the share's owner.
#
# The agent container runs the AI CLIs (claude, codex) for characters and
# recaps. It sees only the staging volume it shares with the Bridge and its own
# config volume: never a library, the Bridge's data or its secrets, and it is
# on its own network, so it can't reach the Bridge or the server (it reaches
# the internet and your LAN through the host, as any container does: an
# OpenAI-compatible endpoint on your network, like Ollama, needs that). Give it
# the Bridge's own agent account, not a shared one: put
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) in a .env file beside
# this one, or sign codex in once with
#   docker compose exec agent audiosilo-bridge agent-login codex
# and set AUDIOSILO_BRIDGE_AGENT_BACKEND: codex on the bridge (it runs claude
# unless told otherwise).
#
# Or pick an OpenAI-compatible endpoint (the OpenAI API, a router, Ollama or LM
# Studio) in the Bridge page's Settings > Agent. Its runs go to agent-endpoint,
# never to the agent container: the endpoint's model runs commands where it
# runs, so that service has a user of its own, its own staging volume, never
# agent-config (docker gives it the image's own /agent as an anonymous volume,
# empty and closed to its user) and no credential, and kills whatever a run
# leaves behind.
# Start it with the profile:
#   docker compose --profile endpoint up -d
# The Bridge refuses endpoint runs (and says why on its page) while it isn't
# set up that way. The endpoint's key is set in Settings > Agent and kept for
# the address it was entered for: another address removes it.
name: audiosilo

services:
  audiosilo:
    image: ghcr.io/kodestar/audiosilo-server:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
    ports:
      - "8080:8080"
    volumes:
      - ./server-data:/data
      - /path/to/audiobooks:/audiobooks:ro

  bridge:
    # :latest is the full image (CPU transcription); :latest-slim has no
    # whisper.cpp, :latest-cuda transcribes on an NVIDIA GPU (amd64).
    image: ghcr.io/kodestar/audiosilo-bridge:latest
    restart: unless-stopped
    depends_on: [audiosilo]
    environment:
      PUID: "1000"
      # &bridge_pgid names this value: the agent container's group_add below
      # follows it, so change it here only.
      PGID: &bridge_pgid "1000"
      # The server as the Bridge reaches it on this network.
      AUDIOSILO_BRIDGE_SERVER_URL: http://audiosilo:8080
      # The Bridge's page as your LAN reaches it (the console links to it).
      AUDIOSILO_BRIDGE_PUBLIC_URL: http://192.168.1.10:8091
      # First start only: a code from the server's console.
      # AUDIOSILO_BRIDGE_PAIR_CODE: XXXX-XXXX-XXXX-XXXX
      # Keep the secrets' key outside the data folder (32 bytes, hex or base64):
      # AUDIOSILO_BRIDGE_SECRET_KEY: ...
      # The folder shared with the agent container (below). Kept outside
      # /bridge-data, whose first-start ownership fix would otherwise reach it.
      AUDIOSILO_BRIDGE_AGENT_STAGING_DIR: /staging
      # The folder shared with agent-endpoint, where an OpenAI-compatible
      # endpoint's runs go (another volume than the one above).
      AUDIOSILO_BRIDGE_AGENT_ENDPOINT_STAGING_DIR: /endpoint-staging
      # The CLI the agent container runs: claude (the default), codex, or
      # openai-compatible (codex against the endpoint below, which needs the
      # Responses API; set its key in Settings > Agent). These lock the
      # page's Settings > Agent fields; leave them out to set them there.
      # AUDIOSILO_BRIDGE_AGENT_BACKEND: codex
      # AUDIOSILO_BRIDGE_AGENT_OPENAI_COMPATIBLE_BASE_URL: http://192.168.1.20:11434/v1
      # AUDIOSILO_BRIDGE_AGENT_OPENAI_COMPATIBLE_MODEL: qwen3:32b
      # Never hand the agent credential to every user on the staging volume
      # (the agent waits instead, saying why, when it can't be kept to the
      # group_add group below):
      # AUDIOSILO_BRIDGE_AGENT_REQUIRE_GROUP: "true"
      # A GitHub token (a fine-grained one that can open issues on the community
      # repos) lets a job contribute its characters and recaps (contribute: issue).
      # Read live and never stored; while set it is used instead of the Accounts
      # tab's GitHub sign-in.
      # AUDIOSILO_BRIDGE_GITHUB_TOKEN: ${AUDIOSILO_BRIDGE_GITHUB_TOKEN}
    ports:
      - "8091:8091"
    # An OpenAI-compatible server on this same host (the agent's line below):
    # Settings > Agent's Test connection runs from the Bridge, so it needs the
    # name too.
    # extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./bridge-data:/bridge-data
      - /path/to/audiobooks:/audiobooks:rw
      # Shared with the agent container, at the Bridge's agent.staging_dir.
      # The only volume both mount.
      - staging:/staging
      # Shared with agent-endpoint, at agent.endpoint_staging_dir.
      - endpoint-staging:/endpoint-staging

  agent:
    image: ghcr.io/kodestar/audiosilo-bridge:latest-agent
    restart: unless-stopped
    user: "10002:10002"
    # The bridge's PGID above (*bridge_pgid follows it): the Bridge hands the
    # agent credential from its Accounts tab to this group alone, never to
    # every user on the staging volume. Without it the hand-off still works,
    # readable by any user until the runner takes it (the Bridge's log says so
    # once).
    group_add: [*bridge_pgid]
    environment:
      # By name only: the value comes from your shell or .env and is never
      # written here. Set the one you use; the runner reports which it found.
      - CLAUDE_CODE_OAUTH_TOKEN
      # - ANTHROPIC_API_KEY
      # - OPENAI_API_KEY
    volumes:
      - staging:/staging
      - agent-config:/agent
    networks: [agent]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    # A stop cancels the runs in progress: SIGTERM, then SIGKILL 10 s later.
    stop_grace_period: 20s

  # An OpenAI-compatible endpoint's own agent service: started only with
  # --profile endpoint. Keep it apart from the agent container: its own user
  # (never the agent's 10002), its own staging volume, never agent-config at
  # /agent or any other path (nor a CLI's login, the bridge's data or docker's
  # socket), and no credential in its environment (nor the bridge's
  # AUDIOSILO_BRIDGE_SECRET_KEY or GitHub token). The image declares /agent a
  # volume, so docker gives this service an anonymous one: a copy of the
  # image's empty /agent, 10002's and 0700, which 10003 can't open. The runner
  # refuses its runs otherwise, and ends a run in progress when one of those
  # comes within its reach.
  agent-endpoint:
    image: ghcr.io/kodestar/audiosilo-bridge:latest-agent
    profiles: [endpoint]
    restart: unless-stopped
    user: "10003:10003"
    # The bridge's PGID, as for the agent container: the endpoint's key is
    # handed to this group alone.
    group_add: [*bridge_pgid]
    # The runner is the container's first process, with no tini before it: a
    # run's commands share its user, and could read or trace any other.
    entrypoint: ["audiosilo-bridge"]
    command: ["agent-runner", "--endpoint-only", "--staging", "/staging"]
    volumes:
      - endpoint-staging:/staging
    networks: [agent-endpoint]
    # An OpenAI-compatible server on this same host (Ollama listening on
    # 0.0.0.0): reach it as http://host.docker.internal:11434/v1.
    # extra_hosts: ["host.docker.internal:host-gateway"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    stop_grace_period: 20s

networks:
  # The agent's own network: nothing else of this stack. It reaches out
  # through the host like any container (the internet and your LAN).
  agent: {}
  # agent-endpoint's, apart from the agent container's too.
  agent-endpoint: {}

volumes:
  staging: {}
  agent-config: {}
  endpoint-staging: {}
